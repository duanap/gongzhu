<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="grassBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8bd06b"/>
      <stop offset="100%" stop-color="#72b857"/>
    </linearGradient>
    <pattern id="weave" width="22" height="22" patternUnits="userSpaceOnUse">
      <rect width="22" height="22" fill="transparent"/>
      <path d="M0 5 H22 M0 16 H22" stroke="#9ddb7c" stroke-opacity="0.28" stroke-width="1"/>
      <path d="M5 0 V22 M16 0 V22" stroke="#6faf52" stroke-opacity="0.18" stroke-width="1"/>
    </pattern>
    <radialGradient id="centerGlow" cx="50%" cy="56%" r="38%">
      <stop offset="0%" stop-color="#f2ffd9" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ddf7be" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ddf7be" stop-opacity="0"/>
    </radialGradient>
    <filter id="softNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#grassBase)"/>
  <rect width="1600" height="900" fill="url(#weave)"/>
  <rect width="1600" height="900" fill="#ffffff" opacity="0.04" filter="url(#softNoise)"/>
  <ellipse cx="800" cy="485" rx="470" ry="310" fill="url(#centerGlow)"/>
  <rect y="0" width="1600" height="110" fill="#ffffff" opacity="0.07"/>
</svg>